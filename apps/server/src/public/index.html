<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket Reset</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- <h1>Real-Time Client Count</h1>
    <div class="client-count">
      Connected Clients: <span id="clientCount">0</span>
    </div> -->

    <h2>Reset Server</h2>
    <button id="resetButton">Reset the Server</button>

    <!-- Include Socket.IO client library -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
      // Connect to the Socket.IO server
      const socket = io();

      document.getElementById('resetButton').addEventListener('click', () => {
        console.log('Resetting the server...');
        socket.emit('reset');
      });
    </script>
  </body>
</html>
